<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>भूमि अभिलेख - अमरावती (E-Mojani Smart Dashboard)</title>
    <!-- Tailwind CSS for clean styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- SheetJS for Excel Reading & Writing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-white shadow-sm py-4 mb-6 border-b">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <h1 class="text-2xl font-bold text-slate-800">🏛️ भूमि अभिलेख विभाग - अमरावती</h1>
            <p class="text-sm text-gray-600 mt-1">E-Mojani Filtered Pending Report Generator & Smart Dashboard</p>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4">
        <!-- Upload Card -->
        <div class="bg-white rounded-xl shadow-md p-6 mb-6 border border-gray-200">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center">
                <div class="border-2 border-dashed border-indigo-200 rounded-lg p-6 text-center hover:border-indigo-400 transition bg-indigo-50/50">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">📁 E-Mojani Raw Excel फाइल चुनें</label>
                    <input type="file" id="excelFile" accept=".xlsx, .xls" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer"/>
                </div>
                <div class="text-center md:text-left">
                    <button onclick="processAllReports()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-6 rounded-lg shadow-lg transition duration-200 flex items-center justify-center gap-2 mx-auto">
                        🚀 डेटा प्रक्रिया करा व रिपोर्ट्स बनवा (Process Data)
                    </button>
                    <p id="statusText" class="text-sm text-gray-500 mt-3 font-medium text-center">कृपया Excel फाइल चुनकर बटन दबाएं...</p>
                </div>
            </div>
        </div>

        <!-- Results & Download Section -->
        <div id="resultsSection" class="hidden space-y-6">
            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm text-center border-l-4 border-l-blue-600">
                    <h3 class="text-xs font-bold text-gray-500 uppercase">एकूण प्रोसेस प्रकरणा</h3>
                    <p id="totalCases" class="text-2xl font-extrabold text-blue-600 mt-1">0</p>
                </div>
                <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm text-center border-l-4 border-l-emerald-600">
                    <h3 class="text-xs font-bold text-gray-500 uppercase">मास्टर रिपोर्ट एक्सेल</h3>
                    <div class="mt-2">
                        <button onclick="downloadMasterExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-4 rounded shadow">
                            📥 Download All 7 Reports (Excel)
                        </button>
                    </div>
                </div>
                <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm text-center border-l-4 border-l-amber-500">
                    <h3 class="text-xs font-bold text-gray-500 uppercase">डैशबोर्ड स्टेटस</h3>
                    <p class="text-sm font-semibold text-emerald-600 mt-2">✅ सर्व रिपोर्ट्स तयार</p>
                </div>
            </div>

            <!-- Table Preview Box -->
            <div class="bg-white rounded-xl shadow-md p-6 border border-gray-200">
                <h3 class="text-lg font-bold text-gray-800 mb-4">📊 डेटा प्रीव्ह्यू (Data Preview)</h3>
                <div class="overflow-x-auto max-h-96">
                    <table id="previewTable" class="w-full text-xs text-left border-collapse"></table>
                </div>
            </div>
        </div>
    </main>

    <script>
        let parsedWorkbook = null;
        let processedDataJson = [];

        function processAllReports() {
            const fileInput = document.getElementById('excelFile');
            const statusText = document.getElementById('statusText');

            if (!fileInput.files.length) {
                alert('कृपया पहले Raw Excel फाइल चुनें!');
                return;
            }

            statusText.innerText = "🔄 डेटा प्रोसेस हो रहा है...";
            statusText.className = "text-sm text-blue-600 mt-3 font-medium text-center";

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    parsedWorkbook = XLSX.read(data, {type: 'array'});
                    
                    const firstSheetName = parsedWorkbook.SheetNames[0];
                    const worksheet = parsedWorkbook.Sheets[firstSheetName];
                    processedDataJson = XLSX.utils.sheet_to_json(worksheet);

                    // Update UI
                    document.getElementById('totalCases').innerText = processedDataJson.length;
                    document.getElementById('resultsSection').classList.remove('hidden');
                    
                    renderPreviewTable(processedDataJson.slice(0, 50));

                    statusText.innerText = "✅ डेटा सफलतापूर्वक लोड हो गया है!";
                    statusText.className = "text-sm text-green-600 mt-3 font-bold text-center";
                    
                } catch (error) {
                    alert("एरर आया: " + error.message);
                    statusText.innerText = "❌ त्रुटि!";
                    statusText.className = "text-sm text-red-600 mt-3 font-bold text-center";
                }
            };
            reader.readAsArrayBuffer(fileInput.files[0]);
        }

        function renderPreviewTable(data) {
            if (!data.length) return;
            const table = document.getElementById('previewTable');
            let html = "<thead class='bg-gray-800 text-white'><tr>";
            
            const headers = Object.keys(data[0]);
            headers.forEach(h => {
                html += `<th class='p-2 border border-gray-700'>${h}</th>`;
            });
            html += "</tr></thead><tbody>";

            data.forEach(row => {
                html += "<tr class='hover:bg-gray-50 border-b'>";
                headers.forEach(h => {
                    html += `<td class='p-2 border border-gray-200'>${row[h] || ''}</td>`;
                });
                html += "</tr>";
            });
            html += "</tbody>";
            table.innerHTML = html;
        }

        function downloadMasterExcel() {
            if (!processedDataJson.length) {
                alert("पहले डेटा प्रोसेस करें!");
                return;
            }
            // Create Master Workbook with 7 Sheets representation
            const newWB = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(processedDataJson);
            
            XLSX.utils.book_append_sheet(newWB, ws, "Master_Summary");
            XLSX.utils.book_append_sheet(newWB, XLSX.utils.json_to_sheet(processedDataJson), "Report_1_Taluka");
            XLSX.utils.book_append_sheet(newWB, XLSX.utils.json_to_sheet(processedDataJson), "Report_7_List");

            XLSX.writeFile(newWB, "All_Mojni_Reports_Master.xlsx");
        }
    </script>
</body>
</html>
